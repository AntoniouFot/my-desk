<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Το γραφείο μου</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }
      .wall {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 70%;
        background: #f4ede3;
      }
      .floor {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 30%;
        background: url(images/floor-tile.svg);
        background-size: 240px 60px;
      }
      .window {
        position: absolute;
        top: 8%;
        left: 38%;
        width: 260px;
        aspect-ratio: 260 / 320;
        cursor: pointer;
      }
      .window .layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
      }
      .curtain {
        position: absolute;
        top: -3%;
        width: 27%;
        transition: transform 0.6s;
      }
      .curtain.left {
        left: -4%;
        transform-origin: left;
        transform: scaleX(0.5);
      }
      .curtain.right {
        left: 104%;
        transform-origin: left;
        transform: scaleX(-0.5);
      }
      .window.closed .curtain.left {
        transform: scaleX(2);
      }
      .window.closed .curtain.right {
        transform: scaleX(-2);
      }
      .desk {
        position: absolute;
        bottom: 12%;
        left: 30%;
        width: 40%;
      }
    </style>
  </head>
  <body>
    <div class="wall" id="wall"></div>
    <div class="floor" id="floor"></div>
    <div class="window" id="window">
      <img class="layer" id="sky" src="images/sky-day.svg" />
      <img class="layer" src="images/window-frame.svg" />
      <img class="curtain left" src="images/curtain.svg" />
      <img class="curtain right" src="images/curtain.svg" />
    </div>
    <img class="desk" src="images/desk.svg" />

    <script>
      // Βρίσκουμε το παράθυρο και τον ουρανό
      const win = document.getElementById("window");
      const sky = document.getElementById("sky");

      // Κλικ στο παράθυρο: ανοιγοκλείνουν οι κουρτίνες
      win.addEventListener("click", () => {
        win.classList.toggle("closed");
      });

      // Τι ώρα είναι;
      const hour = new Date().getHours();
      console.log(hour);

      // Νύχτα ή μέρα;
      if (hour < 7 || hour >= 20) {
        sky.src = "images/sky-night.svg";
      } else {
        sky.src = "images/sky-day.svg";
      }
    </script>
  </body>
</html>
