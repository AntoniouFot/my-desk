<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Το γραφείο μου</title>
    <style>
      /* Τοίχος (πάνω 70%) και πάτωμα (κάτω 30%) */
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(#f4ede3 70%, transparent 70%),
          url(images/floor-tile.svg);
        background-size:
          100% 100%,
          240px 60px;
      }
      img {
        position: absolute;
      }

      /* Το «κουτί» του δωματίου: πάντα 16:9, σαν φωτογραφία */
      .room {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(100vw, 177.78vh);
        aspect-ratio: 16 / 9;
      }

      /* Παράθυρο */
      .window {
        position: absolute;
        top: 5%;
        left: 34%;
        width: 18%;
        aspect-ratio: 260 / 320;
        cursor: pointer;
      }
      .window .layer {
        top: 0;
        left: 0;
        width: 100%;
      }
      .curtain {
        top: -3%;
        width: 27%;
        transition: transform 0.6s;
      }
      .curtain.left {
        left: -4%;
        transform-origin: left;
        transform: scaleX(0.5);
      }
      .curtain.right {
        left: 104%;
        transform-origin: left;
        transform: scaleX(-0.5);
      }
      .window.closed .curtain.left {
        transform: scaleX(2);
      }
      .window.closed .curtain.right {
        transform: scaleX(-2);
      }

      /* Τοίχος */
      .photo-board {
        top: 6%;
        left: 55%;
        width: 26%;
      }
      .calendar-board {
        top: 6%;
        left: 82.5%;
        width: 17%;
      }

      /* Έπιπλα (όσο μικρότερο το bottom, τόσο πιο μπροστά) */
      .rug {
        bottom: 7%;
        left: 21%;
        width: 34%;
      }
      .bookshelf {
        bottom: 25%;
        left: 1%;
        width: 23.5%;
      }
      .desk {
        bottom: 24%;
        left: 27%;
        width: 32%;
      }
      .lamp {
        bottom: 51.5%;
        left: 28%;
        width: 10%;
      }
      .chair-back {
        bottom: 11%;
        left: 30.5%;
        width: 15%;
      }
      .trash-bin {
        bottom: 21%;
        left: 59.5%;
        width: 7%;
      }
      .plant {
        bottom: 25%;
        left: 89%;
        width: 10%;
      }

      /* Αρκούδος */
      .teddy {
        position: absolute;
        bottom: 21%;
        left: 70%;
        width: 18%;
        aspect-ratio: 220 / 260;
        cursor: pointer;
      }
      .teddy .layer {
        top: 0;
        left: 0;
        width: 100%;
      }
      .teddy .arm {
        transform-origin: 72.7% 53%;
        transition: transform 0.3s;
      }
      .teddy.wave .arm {
        transform: rotate(-115deg);
      }
    </style>
  </head>
  <body>
    <div class="room">
      <div class="window" id="window">
        <img class="layer" id="sky" src="images/sky-day.svg" />
        <img class="layer" src="images/window-frame.svg" />
        <img class="curtain left" src="images/curtain.svg" />
        <img class="curtain right" src="images/curtain.svg" />
      </div>
      <img class="photo-board" src="images/photo-board.svg" />
      <img class="calendar-board" src="images/calendar-board.svg" />

      <img class="rug" src="images/rug.svg" />
      <img class="bookshelf" src="images/bookshelf.svg" />
      <img class="plant" src="images/plant.svg" />
      <img class="desk" src="images/desk.svg" />
      <img class="lamp" src="images/lamp.svg" />
      <img class="chair-back" src="images/chair-back.svg" />
      <img class="trash-bin" src="images/trash-bin.svg" />
      <div class="teddy" id="teddy">
        <img class="layer" src="images/teddy-body.svg" />
        <img class="layer arm" src="images/teddy-arm.svg" />
      </div>
    </div>

    <script>
      // Βρίσκουμε το παράθυρο και τον ουρανό
      const win = document.getElementById("window");
      const sky = document.getElementById("sky");

      // Κλικ στο παράθυρο: ανοιγοκλείνουν οι κουρτίνες
      win.addEventListener("click", () => {
        win.classList.toggle("closed");
      });

      // Τι ώρα είναι;
      const hour = new Date().getHours();
      console.log(hour);

      // Νύχτα ή μέρα;
      if (hour < 7 || hour >= 20) {
        sky.src = "images/sky-night.svg";
      } else {
        sky.src = "images/sky-day.svg";
      }

      // Βρες τον αρκούδο
      const teddy = document.getElementById("teddy");

      // Όταν γίνει κλικ στον αρκούδο...
      teddy.addEventListener("click", () => {
        // ...σήκωσε το χέρι
        teddy.classList.add("wave");

        // ...και μετά από 1 δευτερόλεπτο κατέβασέ το
        setTimeout(() => {
          teddy.classList.remove("wave");
        }, 1000);
      });
    </script>
  </body>
</html>
