<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Το γραφείο μου</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }
      .wall {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 70%;
        background: #cf89ba;
      }
      .floor {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 30%;
        background: #6d4421;
      }
      .window {
        position: absolute;
        top: 15%;
        left: 40%;
        width: 200px;
        height: 260px;
        background: #9fd3f0;
        border: 12px solid #8b5a2b;
        cursor: pointer;
        transition: background 0.4s;
      }
      .window.closed {
        background: #4a6b82;
      }
      .desk {
        position: absolute;
        bottom: 12%;
        left: 30%;
        width: 40%;
        height: 30%;
      }
      .desk-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8%;
        background: #ececea;
        border-radius: 4px;
      }
      .desk-leg {
        position: absolute;
        top: 8%;
        width: 4%;
        height: 92%;
        background: #ececea;
      }
      .desk-leg.left {
        left: 3%;
      }
      .desk-leg.right {
        right: 3%;
      }
      .drawer {
        position: absolute;
        top: 8%;
        right: 3%;
        width: 30%;
        height: 60%;
        background: #acacaa;
      }
      .handle {
        position: absolute;
        top: 15%;
        left: 35%;
        width: 30%;
        height: 5%;
        background: #050500;
        border-radius: 4px;
      }
      .mailbox {
        position: absolute;
        bottom: 100%;
        left: 10%;
        width: 12%;
        height: 45%;
        background: linear-gradient(to right, #e8a98a, #f9d9c0 40%, #e8a98a);
        border: 3px solid #c97f63;
        border-radius: 50px 50px 6px 6px;
        box-shadow: 0 6px 8px rgba(0, 0, 0, 0.25);
      }
      .mailbox-slot {
        position: absolute;
        top: 30%;
        left: 20%;
        width: 60%;
        height: 6%;
        background: #5a3a2e;
        border-radius: 4px;
        box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.6);
      }
      .mailbox-label {
        position: absolute;
        bottom: 12%;
        left: 50%;
        transform: translateX(-50%);
        background: #fff7ef;
        color: #c97f63;
        font-family: Georgia, serif;
        font-size: 11px;
        letter-spacing: 1px;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wall" id="wall"></div>
    <div class="floor" id="floor"></div>
    <div class="window" id="window"></div>
    <div class="desk">
      <div class="desk-top"></div>
      <div class="mailbox">
        <div class="mailbox-slot"></div>
        <div class="mailbox-label">INBOX</div>
      </div>
      <div class="desk-leg left"></div>
      <div class="desk-leg right"></div>
      <div class="drawer">
        <div class="handle"></div>
      </div>
    </div>

    <script>
      const win = document.getElementById("window");
      win.addEventListener("click", () => {
        win.classList.toggle("closed");
      });
    </script>
  </body>
</html>
