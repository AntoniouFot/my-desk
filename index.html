<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <title>Το γραφείο μου</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }
      .wall {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 70%;
        background: #cf89ba;
      }
      .floor {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 30%;
        background: #6d4421;
      }
      .window {
        position: absolute;
        top: 15%;
        left: 40%;
        width: 200px;
        height: 260px;
        background: #9fd3f0;
        border: 12px solid #8b5a2b;
        cursor: pointer;
        transition: background 0.4s;
      }
      .window.closed {
        background: #4a6b82;
      }
      .desk {
        position: absolute;
        bottom: 12%;
        left: 30%;
        width: 40%;
        height: 30%;
      }
      .desk-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8%;
        background: #ececea;
        border-radius: 4px;
      }
      .desk-leg {
        position: absolute;
        top: 8%;
        width: 4%;
        height: 92%;
        background: #ececea;
      }
      .desk-leg.left {
        left: 3%;
      }
      .desk-leg.right {
        right: 3%;
      }
      .drawer {
        position: absolute;
        top: 8%;
        right: 3%;
        width: 30%;
        height: 60%;
        background: #acacaa;
      }
      .handle {
        position: absolute;
        top: 15%;
        left: 35%;
        width: 30%;
        height: 5%;
        background: #050500;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="wall" id="wall"></div>
    <div class="floor" id="floor"></div>
    <div class="window" id="window"></div>
    <div class="desk">
      <div class="desk-top"></div>
      <div class="desk-leg left"></div>
      <div class="desk-leg right"></div>
      <div class="drawer">
        <div class="handle"></div>
      </div>
    </div>

    <script>
      const win = document.getElementById("window");
      win.addEventListener("click", () => {
        win.classList.toggle("closed");
      });
    </script>
  </body>
</html>
